<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 700" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff8fb"/>
      <stop offset="100%" stop-color="#fbe6ef"/>
    </linearGradient>
    <radialGradient id="bigPetal" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="55%" stop-color="#fda8c4" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#d65d8a" stop-opacity="0.95"/>
    </radialGradient>
    <radialGradient id="leafG" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#cfe7c4"/>
      <stop offset="100%" stop-color="#6ea581"/>
    </radialGradient>
    <symbol id="peony" viewBox="-100 -100 200 200">
      <g>
        <ellipse cx="0" cy="-58" rx="42" ry="60" fill="url(#bigPetal)"/>
        <ellipse cx="0" cy="-58" rx="42" ry="60" fill="url(#bigPetal)" transform="rotate(45)"/>
        <ellipse cx="0" cy="-58" rx="42" ry="60" fill="url(#bigPetal)" transform="rotate(90)"/>
        <ellipse cx="0" cy="-58" rx="42" ry="60" fill="url(#bigPetal)" transform="rotate(135)"/>
        <ellipse cx="0" cy="-58" rx="42" ry="60" fill="url(#bigPetal)" transform="rotate(180)"/>
        <ellipse cx="0" cy="-58" rx="42" ry="60" fill="url(#bigPetal)" transform="rotate(225)"/>
        <ellipse cx="0" cy="-58" rx="42" ry="60" fill="url(#bigPetal)" transform="rotate(270)"/>
        <ellipse cx="0" cy="-58" rx="42" ry="60" fill="url(#bigPetal)" transform="rotate(315)"/>
        <circle r="22" fill="#f3c34c"/>
        <circle r="10" fill="#a96b14"/>
      </g>
    </symbol>
    <symbol id="cardLeaf" viewBox="-50 -100 100 200">
      <path d="M0,-95 C45,-60 45,40 0,95 C-45,40 -45,-60 0,-95 Z" fill="url(#leafG)"/>
      <path d="M0,-95 L0,95" stroke="#4f7e62" stroke-width="2" opacity="0.55"/>
    </symbol>
  </defs>

  <rect width="500" height="700" fill="url(#paper)"/>

  <g opacity="0.85">
    <use href="#cardLeaf" x="40" y="120" width="120" height="220" transform="rotate(-25 100 230)"/>
    <use href="#cardLeaf" x="320" y="80" width="140" height="240" transform="rotate(20 390 200)"/>
    <use href="#cardLeaf" x="120" y="260" width="120" height="200" transform="rotate(-10 180 360)"/>
    <use href="#cardLeaf" x="280" y="240" width="120" height="200" transform="rotate(15 340 340)"/>
  </g>

  <use href="#peony" x="170" y="160" width="160" height="160"/>
  <use href="#peony" x="80" y="240" width="130" height="130"/>
  <use href="#peony" x="290" y="250" width="140" height="140"/>
  <use href="#peony" x="200" y="330" width="100" height="100"/>

  <g font-family="'Great Vibes', cursive" text-anchor="middle" fill="#7a2950">
    <text x="250" y="100" font-size="56">Happy</text>
    <text x="250" y="540" font-size="64">Mother's Day</text>
  </g>

  <g font-family="'Cormorant Garamond', serif" text-anchor="middle" fill="#7a2950" opacity="0.75">
    <text x="250" y="600" font-size="22" letter-spacing="6">FOR YOU, MOM</text>
  </g>

  <rect x="20" y="20" width="460" height="660" rx="14" ry="14" fill="none" stroke="#d99cb9" stroke-width="1.5" opacity="0.7"/>
</svg>
